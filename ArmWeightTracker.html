<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arm & Weight Tracker</title>
    <link rel="stylesheet" href="theme.css" />
    <style>
      .plots-container {
        display: grid;
        grid-template-columns: 1fr;
        gap: 20px;
      }

      .plots-container:empty {
        display: none;
      }

      .plot-section {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 20px;
        box-shadow: var(--shadow);
      }

      .plot-section h2 {
        margin-top: 0;
      }

      .plot {
        width: 100%;
        height: 500px;
      }

      #errorMessage,
      #projectionStatus {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="navbar">
      <nav>
        <a href="index.html">Home</a>
        <a href="PowerliftingTotals.html">Powerlifting Totals</a>
        <a href="MuscleGroupWeeklyPlanner.html">Muscle Group Planner</a>
        <a href="weeklyVolumeAnalysis.html">Weekly Volume</a>
        <a href="ArmWeightTracker.html" class="active">Arm & Weight Tracker</a>
        <a href="6WeekBenchProgram.html">6 Week Bench</a>
        <div class="dropdown">
          <button type="button" class="dropdown-toggle" aria-haspopup="true" aria-expanded="false">Legacy</button>
          <div class="dropdown-menu">
            <a href="360image.html">360 Image</a>
            <a href="360image2.html">360 Image 2</a>
          </div>
        </div>
      </nav>
    </div>

    <div class="page">
      <div class="page-header">
        <h1>Body Measurement Tracker</h1>
        <p>Import a CSV of arm measurements and bodyweight to plot progress towards your goals.</p>
      </div>

      <div class="error-message" id="errorMessage"></div>

      <div class="card">
        <div class="section-title">Settings</div>
        <div class="form-grid">
          <div class="field">
            <label for="csvInput">Import CSV file</label>
            <input type="file" id="csvInput" accept=".csv" />
          </div>
          <div class="field">
            <label for="upperArmGoal">Upper arm goal (cm)</label>
            <input type="number" id="upperArmGoal" value="43" min="0" step="0.1" />
          </div>
          <div class="field">
            <label for="forearmGoal">Forearm goal (cm)</label>
            <input type="number" id="forearmGoal" value="33" min="0" step="0.1" />
          </div>
          <div class="field">
            <label for="upperWeeklyIncrease">Upper weekly increase (cm)</label>
            <input type="number" id="upperWeeklyIncrease" value="0.05" min="0" step="0.01" />
          </div>
          <div class="field">
            <label for="forearmWeeklyIncrease">Forearm weekly increase (cm)</label>
            <input type="number" id="forearmWeeklyIncrease" value="0.025" min="0" step="0.01" />
          </div>
          <div class="field">
            <label for="trendWeeks">Trend extension (weeks)</label>
            <input type="number" id="trendWeeks" value="12" min="1" step="1" />
          </div>
          <div class="field checkbox">
            <input type="checkbox" id="showFutureTrend" />
            <label for="showFutureTrend">Show future trend</label>
          </div>
        </div>
        <div class="actions" style="margin-top: 16px;">
          <input type="button" class="primary" value="Generate Plots" onclick="generatePlots()" />
        </div>
      </div>

      <div class="card" id="projectionStatus"></div>

      <div class="plots-container" id="plotsContainer"></div>
    </div>

    <script src="src/navbar.js"></script>
    <script src="https://cdn.plot.ly/plotly-2.25.2.min.js"></script>
    <script src="src/ArmWeightTracker.js"></script>
  </body>
</html>
