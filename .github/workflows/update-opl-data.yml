name: Update OpenPowerlifting data

# Rebuilds data/opl from the latest OpenPowerlifting bulk export.
# Runs monthly (each update adds a few MB to the repository history) and can be run by hand
# from the Actions tab.
on:
  schedule:
    - cron: "17 4 2 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build rankings data
        run: python3 scripts/build_opl_data.py

      - name: Commit changes
        run: |
          if git diff --quiet -- data/opl/entries.csv; then
            echo "OpenPowerlifting data is unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data/opl
          git commit -m "Update OpenPowerlifting data"
          git push
